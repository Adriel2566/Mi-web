<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto de inversión al pasar el cursor</title>

  <style>
    img {
      width: 300px;              
      transition: filter 0.3s;   
    }

    img:hover {
      filter: invert(100%);     
    }
  </style>
</head>
<body>

  <h1>Imagen con efecto de inversión</h1>

  
  <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Cristiano_Ronaldo_playing_for_Al_Nassr_FC_against_Persepolis%2C_September_2023_%28cropped%29.jpg" alt="Imagen con efecto">

</body>
</html>
