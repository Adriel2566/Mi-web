<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Navegación</title>

  <style>
    nav ul {
      list-style: none;
      padding: 0;
      width: 200px;
    }

    nav li {
      background: #eb0707;
      color: white;
      padding: 15px;
      margin-bottom: 8px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    nav li:hover {
      background: #ffffff;
    }
  </style>
</head>

<body>

  <nav>
    <ul>
      <li>Productos</li>
      <li>Carrito</li>
      <li>Perfil</li>
    </ul>
  </nav>

</body>
</html>
